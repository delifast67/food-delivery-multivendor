name: Customer app design audit

on:
  pull_request:
    paths:
      - 'enatega-multivendor-app/**'
      - 'enatega-multivendor-web/**'
      - 'scripts/delifast-client-multivendor.test.mjs'
      - '.github/workflows/customer-app-design-audit.yml'
  push:
    branches:
      - feat/delifast-local-ordering
    paths:
      - 'enatega-multivendor-app/**'
      - 'enatega-multivendor-web/**'
      - 'scripts/delifast-client-multivendor.test.mjs'
      - '.github/workflows/customer-app-design-audit.yml'

jobs:
  design-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enatega-multivendor-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: enatega-multivendor-app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check multivendor visual rules
        run: npm run check:multivendor-design

      - name: Check Delifast client boundaries
        run: node --test ../scripts/delifast-client-multivendor.test.mjs
